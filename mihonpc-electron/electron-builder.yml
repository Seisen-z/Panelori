appId: app.mihonpc.desktop
productName: MihonPC
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
extraResources:
  - from: runtime
    to: runtime
  - from: migrations
    to: migrations
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  executableName: MihonPC
nsis:
  artifactName: MihonPC-${version}-setup.${ext}
  shortcutName: MihonPC
  uninstallDisplayName: MihonPC
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.books
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target: AppImage
  category: Education
npmRebuild: true

portable:
  artifactName: MihonPC-${version}-portable.${ext}
